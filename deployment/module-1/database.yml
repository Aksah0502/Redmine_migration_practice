
production:
  adapter: postgresql

  database: <%= ENV.fetch("POSTGRES_DB", "redmine") %>
  host: <%= ENV.fetch("DB_HOST", "db") %>
  username: <%= ENV.fetch("POSTGRES_USER", "redmine") %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD", "build-placeholder") %>

  encoding: utf8
  pool: <%= ENV.fetch("DB_POOL", 5) %>
